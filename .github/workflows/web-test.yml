name: web-test

on:
  push:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/web-test.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'packages/core/**'
      - '.github/workflows/web-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        working-directory: apps/web
        run: bun test
