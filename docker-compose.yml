# OpenDocs self-host. Copy .env.example to .env, edit it, then: docker compose up -d
# Put a reverse proxy with TLS in front of the web port and set PUBLIC_URL to its https URL.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: opendocs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendocs -d opendocs"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bundled S3. Only started with COMPOSE_PROFILES=minio (the default in .env.example).
  # Docker Hub's minio/minio is no longer published, so this uses the Chainguard builds.
  minio:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - miniodata:/data

  # One-shot: creates the bucket (retries until minio is up), then exits.
  # Credentials sit in a URL, so S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY must be URL-safe here.
  minio-init:
    profiles: ["minio"]
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      - minio
    restart: on-failure
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-opendocs}"]
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@minio:9000

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      # Always the bundled postgres, whatever DATABASE_URL says in .env.
      DATABASE_URL: postgresql://opendocs:${POSTGRES_PASSWORD}@postgres:5432/opendocs
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
        required: false

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # /api/* is proxied to the api over the compose network.
        API_ORIGIN: http://api:4000
        BETTER_AUTH_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
    restart: unless-stopped
    environment:
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
